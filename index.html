<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>@slayka</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root {
  --accent: #ffffff;
  --shadow-color: rgba(255, 255, 255, 0.15);
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Onest', sans-serif; cursor: none; }

body {
  height: 100vh;
  background: #050505;
  color: white;
  overflow: hidden;
  perspective: 2000px;
}

#cursor {
  position: fixed;
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transition: transform 0.1s, opacity 0.3s;
  box-shadow: 0 0 15px var(--accent);
}

video.bg {
  position: fixed;
  inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  filter: brightness(.25) contrast(1.1) saturate(1.3);
  z-index: -2;
}

.overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
  z-index: -1;
}

.enter {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(25px);
  z-index: 100;
  transition: 1s ease-in-out;
}

.enter span {
  font-size: 14px;
  font-weight: 300;
  letter-spacing: 8px;
  text-transform: uppercase;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.05); }
}

.card {
  position: absolute;
  top: 50%; left: 50%;
  width: 400px;
  padding: 40px;
  border-radius: 30px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(40px);
  /* Центрирование без смещения */
  transform: translate(-50%, -50%);
  transform-style: preserve-3d;
  box-shadow: 0 25px 50px rgba(0,0,0,0.5);
  opacity: 0;
  visibility: hidden;
  /* Плавный возврат в центр при уходе мышки */
  transition: opacity 1s, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.card.show { opacity: 1; visibility: visible; }

.cover-wrapper {
  position: relative;
  width: 130px; height: 130px;
  margin: 0 auto 25px;
}

.cover {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255,255,255,0.1);
  transition: 0.5s;
}

.name {
  font-size: 38px;
  font-weight: 800;
  background: linear-gradient(to bottom, #fff 30%, #888 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 5px;
}

.bio {
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 1px;
  color: rgba(255,255,255,0.5);
  margin-bottom: 30px;
  height: 18px;
}

.player {
  display: flex;
  align-items: center;
  gap: 15px;
  background: rgba(255,255,255,0.05);
  padding: 12px 20px;
  border-radius: 100px;
}

#play {
  background: none; border: none; color: white;
  font-size: 18px; cursor: none;
}

input[type=range] {
  -webkit-appearance: none;
  background: rgba(255,255,255,0.1);
  height: 4px; border-radius: 2px;
  width: 100%;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px; height: 10px;
  background: white; border-radius: 50%;
}

.bottom-ui {
  margin-top: 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  opacity: 0.6;
}

.wave { display: flex; gap: 3px; height: 15px; align-items: center; }
.wave span {
  width: 3px; background: white;
  animation: wave 1s infinite ease-in-out;
}

@keyframes wave {
  0%, 100% { height: 4px; }
  50% { height: 15px; }
}

#volume { width: 60px; }
</style>
</head>
<body>

<div id="cursor"></div>
<video class="bg" autoplay loop muted playsinline><source src="друн2.mp4" type="video/mp4"></video>
<div class="overlay"></div>
<div class="enter" id="enter"><span>Tap to enter</span></div>

<div class="card" id="card">
  <div style="text-align: center;">
    <div class="cover-wrapper"><img src="cover.jpg" class="cover"></div>
    <div class="name">@slayka</div>
    <div class="bio" id="bio"></div>
    <div class="player">
      <button id="play">▶</button>
      <input type="range" id="progress" value="0">
    </div>
    <div class="bottom-ui">
        <div class="wave">
            <span style="animation-delay: 0.1s"></span>
            <span style="animation-delay: 0.2s"></span>
            <span style="animation-delay: 0.3s"></span>
            <span style="animation-delay: 0.4s"></span>
        </div>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
    </div>
  </div>
</div>

<script>
const enter = document.getElementById('enter');
const card = document.getElementById('card');
const audio = new Audio('друн.mp3');
const play = document.getElementById('play');
const progress = document.getElementById('progress');
const volume = document.getElementById('volume');
const cursor = document.getElementById('cursor');

// Курсор работает везде
document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
});

// Наклон ТОЛЬКО при наведении на саму карточку
card.addEventListener('mousemove', e => {
    const rect = card.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    
    // Вращение + сохранение центрирования translate(-50%, -50%)
    card.style.transform = `translate(-50%, -50%) rotateY(${x * 15}deg) rotateX(${-y * 15}deg)`;
});

// Возврат в идеально ровное состояние, когда мышка уходит с карточки
card.addEventListener('mouseleave', () => {
    card.style.transform = `translate(-50%, -50%) rotateY(0deg) rotateX(0deg)`;
});

enter.onclick = () => {
    enter.style.opacity = '0';
    setTimeout(() => {
        enter.style.display = 'none';
        card.classList.add('show');
        audio.play();
        play.innerText = '⏸';
    }, 1000);
};

play.onclick = () => {
    audio.paused ? audio.play() : audio.pause();
    play.innerText = audio.paused ? '▶' : '⏸';
};

audio.ontimeupdate = () => { if (audio.duration) progress.value = (audio.currentTime / audio.duration) * 100; };
progress.oninput = () => { audio.currentTime = (progress.value / 100) * audio.duration; };
volume.oninput = () => { audio.volume = volume.value; };

const bioEl = document.getElementById('bio');
const text = "fuck insomnia";
let idx = 0, isDeleting = false;

function type() {
    bioEl.innerText = text.substring(0, idx);
    if (!isDeleting && idx < text.length) { idx++; setTimeout(type, 150); }
    else if (isDeleting && idx > 0) { idx--; setTimeout(type, 100); }
    else { isDeleting = !isDeleting; setTimeout(type, 1200); }
}
type();
</script>

</body>
</html>
